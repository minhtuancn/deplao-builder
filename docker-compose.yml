version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deplao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deplao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deplao_secret}
      POSTGRES_DB: ${POSTGRES_DB:-deplao}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/services/db/schema/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deplao} -d ${POSTGRES_DB:-deplao}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
